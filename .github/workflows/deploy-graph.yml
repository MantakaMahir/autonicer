name: Deploy knowledge graph

on:
  push:
    branches: [main]
    paths:
      - graphify-out/**
      - .github/workflows/deploy-graph.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp graphify-out/graph.html graphify-out/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: graphify-out
      - id: deployment
        uses: actions/deploy-pages@v4
